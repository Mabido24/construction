<!doctype html>
<html lang="{{LOCALE}}" dir="{{DIR}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{META_TITLE}}</title>
<meta name="description" content="{{META_DESC}}" />
<link rel="canonical" href="{{CANONICAL}}" />
{{HREFLANG_TAGS}}
<meta property="og:type" content="website" />
<meta property="og:title" content="{{META_TITLE}}" />
<meta property="og:description" content="{{META_DESC}}" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:image" content="{{SITE_URL}}/assets/img/og-cover.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="{{THEME_COLOR}}" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5652e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
{{THEME_FONTS}}
<link rel="stylesheet" href="{{THEME_CSS}}" />
<script>
(function(){try{var t=localStorage.getItem('theme-pref');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HomeAndConstructionBusiness",
  "name": "{{site.name}}",
  "description": "{{meta.home.description}}",
  "url": "{{SITE_URL}}",
  "areaServed": [
    {"@type": "Place", "name": "Rawai, Phuket"},
    {"@type": "Place", "name": "Chalong, Phuket"},
    {"@type": "Place", "name": "Karon, Phuket"},
    {"@type": "Place", "name": "Kata, Phuket"},
    {"@type": "Place", "name": "Wichit, Phuket"},
    {"@type": "Place", "name": "Ratsada, Phuket"},
    {"@type": "Place", "name": "Kathu, Phuket"},
    {"@type": "Place", "name": "Patong, Phuket"}
  ],
  "address": {"@type": "PostalAddress", "addressLocality": "Rawai", "addressRegion": "Phuket", "addressCountry": "TH"},
  "priceRange": "$$",
  "availableLanguage": ["English", "French", "German", "Italian", "Spanish", "Portuguese", "Thai", "Russian", "Chinese", "Arabic"]
}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container nav">
    <a href="{{HOME_HREF}}" class="brand">
      <span class="mark">B</span>
      <span class="brand-text">
        <span class="brand-name">{{site.name}}</span>
        <span class="brand-sub">{{site.name_full}}</span>
      </span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="{{HOME_HREF}}">{{nav.home}}</a>
      <a href="{{CONSTRUCTION_HREF}}">{{nav.construction}}</a>
      <a href="{{RENOVATION_HREF}}">{{nav.renovation}}</a>
      <a href="{{DOMOTICS_HREF}}">{{nav.domotics}}</a>
      <a href="{{CONTACT_HREF}}">{{nav.contact}}</a>
    </nav>
    <div class="nav-tools">
      <div class="lang-switcher" data-lang-switcher>
        <button class="lang-current" data-lang-trigger type="button" aria-haspopup="true">{{LOCALE_UPPER}}</button>
        <div class="lang-menu">
          {{LANG_SWITCHER}}
        </div>
      </div>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn burger" data-burger type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="main">
