<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#ff3d3d"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6bb8ff"/>
      <stop offset="100%" stop-color="#2f8fd6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- roof: two clean strokes meeting at an apex, gradient -->
  <path d="M34,90 L100,32 L166,90" fill="none" stroke="url(#roofGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- walls -->
  <path d="M52,84 L52,158 Q52,163 57,163 L143,163 Q148,163 148,158 L148,84" fill="none" stroke="#f4f5f8" stroke-opacity="0.92" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- door -->
  <path d="M86,163 L86,120 Q86,111 100,111 Q114,111 114,120 L114,163" fill="none" stroke="#f4f5f8" stroke-opacity="0.92" stroke-width="6" stroke-linejoin="round"/>

  <!-- domotics beacon at the roof apex -->
  <circle cx="100" cy="32" r="7.5" fill="url(#pulseGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="32" r="14" fill="none" stroke="url(#pulseGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- renovation accent: level line -->
  <g transform="translate(150,128)">
    <rect x="-24" y="-6" width="48" height="12" rx="6" fill="none" stroke="url(#roofGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="3.2" fill="url(#roofGrad)"/>
  </g>
</svg>
